# Cloudflare Workers — static assets from Next.js `output: 'export'` (`out/`).
# Account: digitop.vn@gmail.com (zone agentkit.best on Cloudflare DNS).
# Custom domains are provisioned by wrangler via `custom_domain = true`.
#
# Deploy:
#   pnpm build && pnpm exec wrangler deploy --env staging     # staging.docs.agentkit.best
#   pnpm build && pnpm exec wrangler deploy --env production  # docs.agentkit.best
#
# CI injects CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (see README).

name = "agentkit-docs"
compatibility_date = "2026-07-20"
# workers.dev fallback while custom domains provision / for dry-run deploys
workers_dev = true

[assets]
directory = "./out"
# Next export emits `path.html` + `path/index.html`; auto-trailing-slash matches
# Fumadocs clean URLs. `_redirects` in `out/` handles locale root redirects.
not_found_handling = "404-page"

# ---- Staging: push to `dev` → staging.docs.agentkit.best ----
[env.staging]
name = "agentkit-docs-staging"
workers_dev = true
routes = [
  { pattern = "staging.docs.agentkit.best", custom_domain = true }
]

[env.staging.assets]
directory = "./out"
not_found_handling = "404-page"

# ---- Production: push to `main` → docs.agentkit.best ----
[env.production]
name = "agentkit-docs"
workers_dev = true
routes = [
  { pattern = "docs.agentkit.best", custom_domain = true }
]

[env.production.assets]
directory = "./out"
not_found_handling = "404-page"
