name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the generated-dir guard can diff against the base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (MDX content)
        run: pnpm lint

      - name: Unit tests (pipeline scripts)
        run: pnpm test

      - name: Kit catalog identity and route guard
        run: pnpm check:catalog

      - name: Stable Kit reconciliation lifecycle guard
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            echo "::error::no trustworthy base revision is available for Stable Kit lifecycle routing"
            exit 1
          fi
          node scripts/check-kit-docs-ci.mjs "$BASE"

      - name: Reference hygiene (no internal leaks in generated reference)
        run: pnpm check:reference

      - name: Generated-dir guard
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # Skip on a branch's first push (no meaningful base to diff against).
          if [[ -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            echo "no base ref to diff — skipping generated-dir guard"
          else
            node scripts/check-generated.mjs --base "$BASE"
          fi

      # JSON overlays (reference-prose-json/) compile to reference-prose/*.md;
      # then reference-raw + prose derive the published pages.
      - name: Prose overlays match JSON sources
        run: node scripts/compile-prose.mjs --check

      # Proves the derived CLI help dump equals generator(reference-raw +
      # reference-prose). This is why the hand-edit guard exempts that dir: any
      # drift (a hand edit, a stale page after a generator/overlay change) shows
      # up as a diff here. Regenerate + commit to fix. Published CLI docs under
      # content/docs/<channel>/reference/cli/ are human-authored separately.
      - name: Reference is regenerated (no drift from source + overlays)
        run: |
          node scripts/generate-reference.mjs
          if ! git diff --quiet -- reference-derived; then
            echo "::error::reference-derived/ is stale. Run 'node scripts/generate-reference.mjs' and commit."
            git --no-pager diff --stat -- reference-derived
            exit 1
          fi

      - name: Build (static export)
        run: pnpm build

      - name: Release quality gates (route shape, output, search)
        run: pnpm check:quality

      - name: Static asset limits
        run: pnpm check:assets

      - name: Link check (internal)
        run: pnpm check:links

      - name: Assert static output
        run: |
          test -f out/en/stable/getting-started/installation.html
          test -f out/vi/stable/getting-started/installation.html
          test -f out/en/llms.txt
          test -f out/_redirects
          test -f out/_headers
          # Sibling Markdown endpoints (issue #29) mirror every page's content.md.
          test -f out/en/stable/getting-started/installation.md
          test -f out/vi/stable/getting-started/installation.md
          # Each sibling is byte-identical to its llms.mdx/docs content.md source.
          cmp out/en/stable/getting-started/installation.md \
            out/en/llms.mdx/docs/stable/getting-started/installation/content.md
          # No server runtime may leak into the static export.
          test ! -d out/_next/server
