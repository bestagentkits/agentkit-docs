name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the generated-dir guard can diff against the base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (MDX content)
        run: pnpm lint

      - name: Unit tests (pipeline scripts)
        run: pnpm test

      - name: Generated-dir guard
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # Skip on a branch's first push (no meaningful base to diff against).
          if [[ -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            echo "no base ref to diff — skipping generated-dir guard"
          else
            node scripts/check-generated.mjs --base "$BASE"
          fi

      - name: Build (static export)
        run: pnpm build

      - name: Link check (internal)
        run: pnpm check:links

      - name: Assert static output
        run: |
          test -f out/en/docs.html
          test -f out/vi/docs.html
          test -f out/en/llms.txt
          test -f out/_redirects
          # No server runtime may leak into the static export.
          test ! -d out/_next/server
