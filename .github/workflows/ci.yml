name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (static export)
        run: pnpm build

      - name: Assert static output
        run: |
          # i18n moves pages under /{lang}; the bare root is a Cloudflare redirect.
          test -f out/en/docs.html
          test -f out/vi/docs.html
          test -f out/en/llms.txt
          test -f out/_redirects
          # No server runtime may leak into the static export.
          test ! -d out/_next/server
