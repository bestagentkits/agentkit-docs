name: Deploy Staging

# Push to `dev` → Cloudflare Worker `agentkit-docs-staging`
# Custom domain: staging.docs.agentkit.best
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging-agentkit-docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy staging Worker
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.docs.agentkit.best

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (static export)
        run: pnpm build

      - name: Static asset limits
        run: pnpm check:assets

      - name: Assert static output
        run: |
          test -f out/en/stable/getting-started/installation.html
          test -f out/vi/stable/getting-started/installation.html
          test -f out/_redirects
          test ! -d out/_next/server

      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env staging

      - name: Smoke staging
        run: |
          set -euo pipefail
          # Custom domain may take a short moment to attach on first deploy.
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
              "https://staging.docs.agentkit.best/" || echo "000")
            echo "attempt $i → HTTP $code"
            if [[ "$code" =~ ^(200|301|302|307|308)$ ]]; then
              echo "staging OK"
              exit 0
            fi
            sleep 10
          done
          exit 1
