name: Deploy Production

# Push to `main` → Cloudflare Worker `agentkit-docs`
# Custom domain: docs.agentkit.best
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-agentkit-docs
  # Queue production deploys — do not interrupt an in-flight wrangler upload.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://docs.agentkit.best

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (static export)
        run: pnpm build

      - name: Static asset limits
        run: pnpm check:assets

      - name: Assert static output
        run: |
          test -f out/en/stable/getting-started/installation.html
          test -f out/vi/stable/getting-started/installation.html
          test -f out/_redirects
          test ! -d out/_next/server

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env production

      - name: Smoke production
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
              "https://docs.agentkit.best/" || echo "000")
            echo "attempt $i → HTTP $code"
            if [[ "$code" =~ ^(200|301|302|307|308)$ ]]; then
              echo "production OK"
              exit 0
            fi
            sleep 10
          done
          exit 1
